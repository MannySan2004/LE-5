<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Webpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="title">Dynamic Content</h1>
        <button id="changeBtn">Change Content</button>
        <div id="content">
            <p>Click the button to see dynamic changes!</p>
        </div>
        <input type="text" id="textInput" placeholder="Enter text here">
        <button id="addBtn">Add Text</button>
        <ul id="list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
